# Builds the Docker setup and checks that the website really works inside it:
# installer, sign-in, every admin page, clean addresses, private folders and saved data.
name: Docker build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      B: http://localhost:8080
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the containers
        run: docker compose up -d --build --wait --wait-timeout 240

      - name: Run the installer and sign in
        run: |
          set -e
          csrf() { grep -o 'name="csrf" value="[a-f0-9]*"' | head -1 | sed 's/.*value="//;s/"//'; }
          for i in $(seq 1 30); do curl -s -o /dev/null "$B/" && break; sleep 2; done

          token=$(curl -s -c jar -b jar "$B/install" | csrf)
          curl -s -c jar -b jar --data-urlencode "csrf=$token" \
            -d "full_name=CI Admin&username=ciadmin&password=ci-password-123&password_confirm=ci-password-123&sample=1" \
            "$B/install" | grep -q "Installation complete"
          echo "installer: ok"

          test "$(curl -s -o /dev/null -w '%{http_code}' "$B/install")" = "302"
          echo "installer hidden after setup: ok"

          token=$(curl -s -c jar -b jar "$B/admin/login" | csrf)
          test "$(curl -s -c jar -b jar -o /dev/null -w '%{http_code}' --data-urlencode "csrf=$token" \
            -d "username=ciadmin&password=ci-password-123" "$B/admin/login")" = "302"
          echo "sign-in: ok"

      - name: Check every page
        run: |
          set -e
          for p in "" "check" "check?student_no=2026-0001&last_name=Reyes" \
                   "admin/" "admin/attendance" "admin/attendance?subject_id=1" "admin/quick_entry" "admin/records" \
                   "admin/report_daily" "admin/report_status?status=Absent" "admin/report_student?id=1" \
                   "admin/report_summary" "admin/students" "admin/subjects" "admin/enroll?subject_id=1" \
                   "admin/users" "admin/profile"; do
            code=$(curl -s -b jar -o page.html -w '%{http_code}' "$B/$p")
            echo "$code /$p"
            test "$code" = "200"
            grep -q "Something went wrong" page.html && exit 1 || true
          done
          curl -s "$B/check?student_no=2026-0001&last_name=Reyes" | grep -q "Overall attendance"
          curl -s -b jar "$B/admin/report_summary?export=csv" | grep -q "Student ID"
          echo "pages, student lookup and CSV export: ok"

      - name: Check clean addresses and private folders
        run: |
          set -e
          # expect <description> <actual> <expected>
          expect() { echo "$1: got '$2', want '$3'"; test "$2" = "$3"; }
          expect "/admin/login.php redirects" "$(curl -s -o /dev/null -w '%{redirect_url}' "$B/admin/login.php")" "$B/admin/login"
          expect "/index.php redirects" "$(curl -s -o /dev/null -w '%{redirect_url}' "$B/index.php")" "$B/"
          expect "/admin/index.php redirects" "$(curl -s -o /dev/null -w '%{redirect_url}' "$B/admin/index.php")" "$B/admin/"
          expect "/includes is private" "$(curl -s -o /dev/null -w '%{http_code}' "$B/includes/header")" "403"
          expect "/sql is private" "$(curl -s -o /dev/null -w '%{http_code}' "$B/sql/schema.sql")" "403"
          expect "phpMyAdmin answers" "$(curl -s http://localhost:8081/ | grep -qi phpmyadmin && echo yes)" "yes"

      - name: Check data survives a restart
        run: |
          set -e
          docker compose down
          docker compose up -d --wait --wait-timeout 240
          test "$(curl -s -o /dev/null -w '%{http_code}' "$B/install")" = "302"
          echo "data kept after restart: ok"

      - name: No PHP errors in the server log
        if: always()
        run: |
          docker compose logs web
          if docker compose logs web | grep -E "PHP (Fatal|Parse|Warning|Notice)"; then exit 1; fi
